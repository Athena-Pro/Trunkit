name: CI and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres-trunkit:
        image: postgres:16
        env:
          POSTGRES_USER: trunk
          POSTGRES_PASSWORD: trunk
          POSTGRES_DB: trunk
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-nerode:
        image: postgres:16
        env:
          POSTGRES_USER: nerode
          POSTGRES_PASSWORD: nerode
          POSTGRES_DB: nerode
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Release tag must match package version'"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/

      - name: Apply Trunkit schema
        env:
          CALX_DSN: postgresql://trunk:trunk@localhost:5434/trunk
        # Exercise the same transactional, numeric-aware loader users invoke.
        # Shell sorting full paths placed 100_* before 10_* and psql continued
        # after the resulting errors, leaving CI with a partial schema.
        run: trunkit --dsn "$CALX_DSN" init

      - name: Apply Nerode schema
        env:
          NERODE_DSN: postgresql://nerode:nerode@localhost:5435/nerode
        # Same loader as the Makefile, through the shipped CLI rather than an
        # inline script, so the DSN appears once and CI exercises the entry
        # point users actually run.
        run: nerode --dsn "$NERODE_DSN" close --apply

      - name: Test
        env:
          CALX_TEST_DSN: postgresql://trunk:trunk@localhost:5434/trunk
          NERODE_DSN: postgresql://nerode:nerode@localhost:5435/nerode
          NERODE_TEST_DSN: postgresql://nerode:nerode@localhost:5435/nerode
          TRUNKIT_REQUIRE_TEST_DBS: "1"
        run: pytest -m "not slow and not primesieve and not network"

  linux-wheel-smoke:
    # Test the actual wheel, without dev extras. This catches Linux installs
    # that resolve pure psycopg but cannot load a system libpq.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Smoke the libpq-free Linux install
        # [binary], not a bare install: the base dependency is deliberately pure
        # psycopg so Termux/ARM can install at all, which means the base wheel
        # still wants a system libpq. `trunkit[binary]` IS the supported
        # zero-system-libpq path, so that is what has to be proven here.
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install "${wheel}[binary]"
          .wheel-smoke/bin/python -c "from psycopg import pq; assert pq.__impl__ == 'binary', pq.__impl__"
          .wheel-smoke/bin/trunkit --help
          .wheel-smoke/bin/nerode --help
          .wheel-smoke/bin/trunkit quickstart --compose-only --dir "${RUNNER_TEMP}/trunkit-quickstart"

      - name: Smoke MCP extra
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          .wheel-smoke/bin/python -m pip install "${wheel}[binary,mcp]"
          .wheel-smoke/bin/python -c "from importlib.metadata import version; assert version('mcp').split('.', 1)[0] == '1'"
          .wheel-smoke/bin/python -c "from trunkit_mcp import server; assert server.mcp is not None"

  muse-wheel-smoke:
    uses: ./.github/workflows/muse-wheel-smoke.yml

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installed container
        run: docker build --tag trunkit-smoke .
      - name: Smoke installed CLIs and bundled checker
        run: |
          docker run --rm trunkit-smoke --help
          docker run --rm --entrypoint trunkit trunkit-smoke --help
          docker run --rm --entrypoint python trunkit-smoke -c "from calx.cli import _resolve_tool; assert _resolve_tool('cert_formal.py').is_file()"

  windows-smoke:
    # The CLIs ship Unicode marks (✓ ✗ →) that crash on legacy cp1252 consoles
    # unless stdio is reconfigured; this leg pins that fix and basic CLI health
    # on Windows, where no database is available.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: CLI smoke under cp1252
        shell: pwsh
        env:
          PYTHONIOENCODING: cp1252
          PYTHONUTF8: "0"
        run: |
          trunkit --help
          nerode --help
          python -c "from calx.cli import _utf8_stdio; _utf8_stdio(); print('✓ ✗ →')"
          trunkit quickstart --compose-only --dir $env:RUNNER_TEMP\qs

      - name: Unit tests (no database — DB-backed tests self-skip)
        shell: pwsh
        env:
          PYTHONIOENCODING: cp1252
        run: pytest -m "not slow and not primesieve and not network" -q

  build:
    runs-on: ubuntu-latest
    needs: [ci, linux-wheel-smoke, muse-wheel-smoke, container-smoke, windows-smoke]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish GitHub release and package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Trunkit ${GITHUB_REF_NAME#v}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Trunkit ${GITHUB_REF_NAME#v}" --generate-notes
          fi
